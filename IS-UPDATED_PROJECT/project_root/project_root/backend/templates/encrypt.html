<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Encryption & Decryption</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #061E29;
      color: #F3F4F4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
    }
    .module-container {
      background: #1D546D;
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      border: 2px solid #5F9598;
    }
    h3 {
      text-align: center;
      margin-bottom: 30px;
      color: #F3F4F4;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    .form-control {
      border-radius: 12px;
      border: 2px solid #5F9598;
      background: #F3F4F4;
      color: #061E29;
      padding: 10px;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #1D546D;
      box-shadow: 0 0 5px #1D546D;
    }
    .btn {
      width: 100%;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.2s;
      padding: 10px;
    }
    .btn-success {
      background: #5F9598;
      border: 2px solid #1D546D;
      color: #061E29;
    }
    .btn-success:hover {
      background: #1D546D;
      color: #F3F4F4;
      border-color: #5F9598;
    }
    .btn-warning {
      background: #F3F4F4;
      border: 2px solid #5F9598;
      color: #061E29;
    }
    .btn-warning:hover {
      background: #5F9598;
      color: #F3F4F4;
      border-color: #1D546D;
    }
    .form-section {
      margin-bottom: 40px;
    }
    .alert {
      margin-top: 15px;
      display: none;
    }
    @media(max-width: 600px){
      .module-container { width: 90%; padding: 20px; }
      .btn { font-size: 14px; padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="module-container">
    <h3>File Encryption / Decryption</h3>

    <!-- Encryption Form -->
    <div class="form-section">
      <form id="encryptForm" enctype="multipart/form-data">
        <input type="file" name="file" class="form-control mt-2" required>
        <button class="btn btn-success mt-3" type="submit">Encrypt File</button>
        <div class="alert alert-success" id="encryptAlert">File encrypted successfully!</div>
        <div class="alert alert-danger" id="encryptError">Encryption failed!</div>
      </form>
    </div>

    <!-- Decryption Form -->
    <div class="form-section">
      <form id="decryptForm" enctype="multipart/form-data">
        <input type="file" name="file" class="form-control mt-2" required>
        <input type="password" name="password" class="form-control mt-2" placeholder="Enter key password" required>
        <button class="btn btn-warning mt-3" type="submit">Decrypt File</button>
        <div class="alert alert-success" id="decryptAlert">File decrypted successfully!</div>
        <div class="alert alert-danger" id="decryptError">Decryption failed! Wrong password or corrupted file.</div>
      </form>
    </div>
  </div>

<script>
  // ----- ENCRYPTION -----
  document.getElementById("encryptForm").onsubmit = async (e)=>{
    e.preventDefault();
    const form = new FormData(e.target);
    const encryptAlert = document.getElementById("encryptAlert");
    const encryptError = document.getElementById("encryptError");
    encryptAlert.style.display = "none";
    encryptError.style.display = "none";

    try{
      const res = await fetch("/api/encrypt",{method:"POST",body:form});
      if(!res.ok) throw new Error("Encryption failed!");
      const blob = await res.blob();
      const fileInput = e.target.querySelector('input[type="file"]');
      const filename = fileInput.files[0].name + ".enc";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      encryptAlert.style.display = "block";
    } catch(err){
      encryptError.style.display = "block";
      console.error(err);
    }
  };

  // ----- DECRYPTION -----
  document.getElementById("decryptForm").onsubmit = async (e)=>{
    e.preventDefault();
    const form = new FormData(e.target);
    const decryptAlert = document.getElementById("decryptAlert");
    const decryptError = document.getElementById("decryptError");
    decryptAlert.style.display = "none";
    decryptError.style.display = "none";

    try{
      const res = await fetch("/api/decrypt",{method:"POST",body:form});
      if(!res.ok) throw new Error("Decryption failed!");
      const blob = await res.blob();
      const fileInput = e.target.querySelector('input[type="file"]');
      const filename = fileInput.files[0].name.replace(".enc",".dec");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      decryptAlert.style.display = "block";
    } catch(err){
      decryptError.style.display = "block";
      console.error(err);
    }
  };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisWeb™ Scanner</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* ---------------- GLOBAL ---------------- */
body {
  font-family: 'Inter', sans-serif;
  margin:0;
  background: #070B14;
  color: #FFFFFF;
  overflow-x: hidden;
}

/* Subtle Cyber Grid */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;
  z-index:0;
}

/* ---------------- FLOATING ICONS ---------------- */
.floating {
  position: absolute;
  color: rgba(0,229,255,0.25);
  animation: float 16s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}

.float-lg { font-size: 4.5rem; }
.float-md { font-size: 3rem; }

.f1 { top: 15%; left: 5%; }
.f2 { top: 25%; left: 85%; }
.f3 { top: 65%; left: 10%; }
.f4 { top: 70%; left: 80%; }

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-40px); }
}

/* ---------------- HEADER ---------------- */
.header {
  padding: 70px 20px 40px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.header h1 {
  font-size: 3rem;
  font-weight: 700;
}

.header h1 span {
  color: #00E5FF;
}

.header p {
  margin-top: 14px;
  color: #9CA3AF;
  font-size: 1.05rem;
}

/* ---------------- SCANNER CARD ---------------- */
.scanner-container {
  max-width: 800px;
  margin: auto;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 48px 40px;
  position: relative;
  z-index: 1;
  transition: all 0.35s ease;
}

.scanner-container:hover {
  transform: translateY(-8px);
  border-color: #00E5FF;
  box-shadow: 0 35px 80px rgba(0,0,0,0.45);
}

/* ---------------- INPUTS ---------------- */
input, select {
  width: 100%;
  padding: 14px 16px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 15px;
  background: #0E1625;
  color: #FFFFFF;
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
  border-color: #00E5FF;
  box-shadow: 0 0 0 2px rgba(0,229,255,0.15);
}

label {
  font-size: 14px;
  color: #9CA3AF;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 0;
}

/* ---------------- BUTTON ---------------- */
button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg,#00E5FF,#2563EB);
  color: #070B14;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 12px;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 16px 45px rgba(0,229,255,0.45);
}

/* ---------------- STATUS ---------------- */
.status {
  margin-top: 18px;
  font-weight: 600;
  text-align: center;
  color: #9CA3AF;
}

/* ---------------- PROGRESS ---------------- */
.progress-container {
  width: 100%;
  background-color: rgba(255,255,255,0.08);
  border-radius: 999px;
  margin: 14px 0;
  overflow: hidden;
  height: 18px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #00E5FF, #2563EB);
  width: 0%;
  transition: width 0.3s ease;
  text-align: center;
  color: #070B14;
  font-size: 12px;
  font-weight: 600;
  line-height: 18px;
}

/* ---------------- ALERTS ---------------- */
.alert {
  background: #0E1625;
  border-left: 5px solid #ef4444;
  margin-top: 16px;
  padding: 18px;
  border-radius: 14px;
  font-size: 14px;
  border: 1px solid rgba(255,255,255,0.1);
}

.low { border-color: #22c55e; }
.medium { border-color: #f59e0b; }
.high { border-color: #ef4444; }

.label {
  font-weight: 600;
  color: #00E5FF;
}

.footer-note {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: #9CA3AF;
}

</style>
</head>
<body>

<!-- FLOATING ICONS -->
<i class="floating float-lg f1 fas fa-shield-halved"></i>
<i class="floating float-md f2 fas fa-terminal"></i>
<i class="floating float-lg f3 fas fa-bug"></i>
<i class="floating float-md f4 fas fa-network-wired"></i>

<!-- HEADER -->
<section class="header">
  <h1><span>AegisWeb™</span> Vulnerability Scanner</h1>
  <p>Ethical web security assessment powered by OWASP ZAP. Scan only systems you are authorized to test.</p>
</section>

<!-- SCANNER -->
<div class="scanner-container">
  <input id="urlInput" type="text" placeholder="Enter target URL (e.g. http://testphp.vulnweb.com/)">

  <select id="mode">
    <option value="fast">Fast Scan (Spider + Passive)</option>
    <option value="full">Full Scan (Active + Passive)</option>
  </select>

  <label>
    <input type="checkbox" id="auth">
    I confirm I own this website or have explicit permission to scan it
  </label>

  <button onclick="startScan()">Start Security Scan</button>

  <div class="status" id="status"></div>

  <div class="progress-container">
    <div id="spiderProgress" class="progress-bar">Spider 0%</div>
  </div>

  <div class="progress-container">
    <div id="ascanProgress" class="progress-bar">Active Scan 0%</div>
  </div>

  <div id="results"></div>

  <div class="footer-note">
    AegisWeb™ operates under ethical security guidelines. Unauthorized scanning is prohibited.
  </div>
</div>

<script>
let scanId = null;
let timer = null;

function startScan() {
  const url = document.getElementById("urlInput").value;
  const mode = document.getElementById("mode").value;
  const auth = document.getElementById("auth").checked;

  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const spiderBar = document.getElementById("spiderProgress");
  const ascanBar = document.getElementById("ascanProgress");

  if (!url) { status.innerText = "❌ Please enter a target URL"; return; }
  if (!auth) { status.innerText = "❌ Authorization confirmation required"; return; }

  status.innerText = "⏳ Initializing scan...";
  results.innerHTML = "";
  spiderBar.style.width = "0%";
  spiderBar.innerText = "Spider 0%";
  ascanBar.style.width = "0%";
  ascanBar.innerText = "Active Scan 0%";

  fetch("/api/scan_async", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ url: url, mode: mode })
  })
  .then(res => res.json())
  .then(data => {
    scanId = data.scan_id;
    timer = setInterval(checkStatus, 2000);
  });
}

function checkStatus() {
  fetch(`/api/scan_status/${scanId}`)
  .then(res => res.json())
  .then(data => {
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const spiderBar = document.getElementById("spiderProgress");
    const ascanBar = document.getElementById("ascanProgress");

    if (data.status === "running") {
      spiderBar.style.width = (data.spiderProgress || 0) + "%";
      spiderBar.innerText = `Spider ${data.spiderProgress || 0}%`;

      ascanBar.style.width = (data.ascanProgress || 0) + "%";
      ascanBar.innerText = `Active Scan ${data.ascanProgress || 0}%`;

      status.innerText = "⏳ Scan in progress...";
    } else {
      clearInterval(timer);
      spiderBar.style.width = "100%";
      spiderBar.innerText = "Spider 100%";
      ascanBar.style.width = "100%";
      ascanBar.innerText = "Active Scan 100%";

      status.innerText = `✅ Scan complete (${data.scan_type}) | Alerts found: ${data.alerts.length}`;

      if (data.alerts.length === 0) {
        results.innerHTML = "<p class='mt-3'>No vulnerabilities found 🎉</p>";
        return;
      }

      results.innerHTML = "";
      data.alerts.forEach(alert => {
        const div = document.createElement("div");
        const riskClass = alert.risk.toLowerCase();
        div.className = `alert ${riskClass}`;
        div.innerHTML = `
          <p><span class="label">Vulnerability:</span> ${alert.name}</p>
          <p><span class="label">Risk:</span> ${alert.risk}</p>
          <p><span class="label">Description:</span> ${alert.description}</p>
          <p><span class="label">Solution:</span> ${alert.solution}</p>
        `;
        results.appendChild(div);
      });
    }
  });
}
</script>

</body>
</html>

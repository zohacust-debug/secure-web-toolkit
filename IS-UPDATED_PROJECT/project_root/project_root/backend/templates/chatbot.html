<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AegisWeb™ | Cyber Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* ---------------- GLOBAL ---------------- */
body {
    font-family: 'Inter', sans-serif;
    background: #070B14;
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    overflow: hidden;
}

/* Subtle Cyber Grid */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none;
    z-index:0;
}

/* ---------------- FLOATING CYBER ICONS ---------------- */
.floating {
    position: absolute;
    color: rgba(0,229,255,0.18);
    font-size: 3rem;
    animation: float 18s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

.f1 { top: 12%; left: 6%; animation-duration: 20s; }
.f2 { top: 30%; left: 85%; animation-duration: 16s; }
.f3 { top: 65%; left: 12%; animation-duration: 22s; }
.f4 { top: 50%; left: 75%; animation-duration: 18s; }
.f5 { top: 80%; left: 45%; animation-duration: 24s; }

@keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-35px) rotate(10deg); }
}

/* ---------------- CHAT CONTAINER ---------------- */
.chat-container {
    background: #0E1625;
    width: 420px;
    max-width: 95%;
    height: 85%;
    border-radius: 22px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255,255,255,0.08);
}

/* ---------------- HEADER ---------------- */
.chat-header {
    background: linear-gradient(135deg,#00E5FF,#2563EB);
    padding: 20px 15px 24px 15px;
    text-align: center;
    color: #070B14;
    position: relative;
}

/* Cute Bot Avatar */
.bot-avatar {
    width: 78px;
    height: 78px;
    background: #ffffff;
    border-radius: 50%;
    margin: 0 auto 8px auto;
    position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* Eyes */
.bot-avatar::before, 
.bot-avatar::after {
    content: "";
    position: absolute;
    top: 32px;
    width: 7px;
    height: 7px;
    background: #333;
    border-radius: 50%;
}
.bot-avatar::before { left: 26px; }
.bot-avatar::after { right: 26px; }

/* Smile */
.bot-smile {
    position: absolute;
    bottom: 20px;
    left: 50%;
    width: 24px;
    height: 12px;
    border-bottom: 3px solid #333;
    border-radius: 0 0 20px 20px;
    transform: translateX(-50%);
}

/* White Cap */
.bot-cap {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 62px;
    height: 30px;
    background: #ffffff;
    border-radius: 12px 12px 6px 6px;
    border: 2px solid #e5e7eb;
}
.bot-cap::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 34px;
    height: 6px;
    background: #ffffff;
    border-radius: 0 0 6px 6px;
    border: 2px solid #e5e7eb;
    border-top: none;
}

/* Header Text */
.chat-header h2 {
    margin: 8px 0 2px 0;
    font-size: 1.35rem;
    font-weight: 700;
}
.chat-header p {
    font-size: 0.85rem;
    margin: 0;
    opacity: 0.9;
}

/* ---------------- CHAT AREA ---------------- */
#chat {
    flex: 1;
    padding: 18px;
    overflow-y: auto;
    background: #070B14;
}

/* User Message */
.user-msg {
    text-align: right;
    margin: 10px 0;
}
.user-msg span {
    display: inline-block;
    background: linear-gradient(135deg,#2563EB,#00E5FF);
    color: #070B14;
    padding: 9px 14px;
    border-radius: 14px 14px 4px 14px;
    font-size: 0.9rem;
    max-width: 80%;
    box-shadow: 0 4px 12px rgba(0,229,255,0.35);
}

/* Bot Message */
.bot-msg {
    text-align: left;
    margin: 10px 0 16px 0;
}
.bot-msg span {
    display: inline-block;
    background: #0E1625;
    color: #e5e7eb;
    padding: 9px 14px;
    border-radius: 14px 14px 14px 4px;
    font-size: 0.9rem;
    max-width: 80%;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
}

/* ---------------- INPUT AREA ---------------- */
.input-area {
    display: flex;
    padding: 14px;
    gap: 10px;
    background: #0E1625;
    border-top: 1px solid rgba(255,255,255,0.08);
}

#msg {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 14px;
    outline: none;
    background: #070B14;
    color: #ffffff;
}

#msg::placeholder {
    color: #9CA3AF;
}

#msg:focus {
    border-color: #00E5FF;
}

/* Send Button */
button {
    padding: 10px 18px;
    background: linear-gradient(135deg,#00E5FF,#2563EB);
    border: none;
    border-radius: 20px;
    color: #070B14;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}

button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0,229,255,0.45);
}

/* Scrollbar */
#chat::-webkit-scrollbar {
    width: 6px;
}
#chat::-webkit-scrollbar-thumb {
    background: rgba(0,229,255,0.4);
    border-radius: 10px;
}
</style>
</head>
<body>

<!-- Floating Cyber Icons -->
<i class="floating f1 fas fa-shield-halved"></i>
<i class="floating f2 fas fa-terminal"></i>
<i class="floating f3 fas fa-user-secret"></i>
<i class="floating f4 fas fa-brain"></i>
<i class="floating f5 fas fa-network-wired"></i>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <div class="bot-avatar">
            <div class="bot-cap"></div>
            <div class="bot-smile"></div>
        </div>
        <h2>AegisWeb™ Assistant</h2>
        <p>Web Protection & Cyber Intelligence</p>
    </div>

    <!-- Chat Messages -->
    <div id="chat"></div>

    <!-- Input -->
    <div class="input-area">
        <input id="msg" placeholder="Ask about cybersecurity, threats, or web protection..." />
        <button onclick="send()">Send</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
const chatBox = document.getElementById("chat");
const input = document.getElementById("msg");
let msgCount = 0;

async function send() {
    const msg = input.value.trim();
    if (!msg) return;

    msgCount++;
    const botId = `bot-${msgCount}`;

    chatBox.innerHTML += `
        <div class="user-msg"><span>${msg}</span></div>
        <div class="bot-msg" id="${botId}"><span>Typing... 💭</span></div>
    `;

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const botDiv = document.getElementById(botId);

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
        });

        const data = await response.json();
        botDiv.innerHTML = `<span>${marked.parse(data.reply)}</span>`;
        chatBox.scrollTop = chatBox.scrollHeight;

    } catch (err) {
        botDiv.innerHTML = `<span>❌ Sorry! Something went wrong.</span>`;
    }
}

input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
});
</script>

<!-- Font Awesome -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>

</body>
</html>
